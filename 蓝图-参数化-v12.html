<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可变多形态座舱跨界车 · 参数化剖面蓝图 v12</title>
<style>
  :root{--bg:#0d1117;--panel:#141a22;--line:#2d3742;--ink:#c9d4e0;--dim:#6b7a8c;
  --blue:#4aa3ff;--green:#5fd08a;--orange:#f0a35e;--purple:#b48ead;--cyan:#56c8d8;--yellow:#e8d174;--red:#e57373}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:13px;padding:12px}
  h1{font-size:17px} h1 .en{color:var(--dim);font-size:11px;font-weight:400;margin-left:8px}
  .sub{color:var(--dim);font-size:11px;margin:3px 0 8px;line-height:1.6}
  .wrap{display:flex;gap:10px;align-items:flex-start}
  .left{flex:1;min-width:0}
  .right{width:344px;flex-shrink:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
  .ctrl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:calc(100vh - 60px);overflow-y:auto}
  .modes{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
  .mbtn{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:#10161d;color:var(--dim);cursor:pointer;font-size:11px;user-select:none}
  .mbtn:hover{border-color:#3d5876}
  .mbtn.on{color:#fff;background:#1c2f45;border-color:var(--blue)}
  .sec{color:var(--dim);font-size:10px;letter-spacing:1px;margin:9px 0 4px;border-top:1px dashed var(--line);padding-top:6px}
  .ctl{margin-bottom:5px}
  .ctl label{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
  .ctl label b{color:var(--blue);font-family:ui-monospace,monospace;font-weight:600;min-width:50px;text-align:right}
  .ctl input.num{width:58px;background:#0b1017;border:1px solid var(--line);color:var(--ink);border-radius:4px;font:11px ui-monospace,monospace;padding:1px 3px;text-align:right}
  .track{position:relative;height:15px;margin-top:1px}
  .track .base{position:absolute;left:0;right:0;top:4px;height:8px;background:#232e3a;border-radius:4px}
  .track .band{position:absolute;inset:0;pointer-events:none}
  .track .seg{position:absolute;top:4px;height:8px;background:#2f9260;border-radius:4px}
  .track input{position:relative;width:100%;height:15px;-webkit-appearance:none;appearance:none;background:transparent}
  .track input::-webkit-slider-runnable-track{height:6px;margin-top:5px;background:transparent}
  .track input::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-4px;border-radius:50%;background:#4aa3ff;border:none;cursor:pointer}
  .track input::-moz-range-track{height:6px;background:transparent}
  .track input::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#4aa3ff;border:none;cursor:pointer}
  .warn{color:var(--red);font-size:11px;line-height:1.5}
  .ok{color:var(--green);font-size:11px;line-height:1.5}
  .flag{color:var(--orange);font-size:11px;line-height:1.5}
  .dim{color:#5c7386;font-size:11px;line-height:1.5}
  table{border-collapse:collapse;font-size:11px;width:100%}
  th,td{border:1px solid var(--line);padding:1px 5px;text-align:left}

  svg{display:block;width:100%;height:auto} text{font-family:inherit}
  .lg{display:flex;flex-wrap:wrap;gap:9px;font-size:10.5px;color:var(--dim);padding:4px 2px 0}
  .lg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:3px}
</style>

<body>
<h1>可变多形态座舱跨界车 <span class="en">v12 · 剖面引擎</span></h1>
<div class="sub" id="sub"></div>
<div class="wrap">
  <div class="left">
    <div class="panel">
      <svg id="sv" viewBox="0 0 1420 880" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="lg">
        <span><i style="background:#4a6076"></i>车身</span><span><i style="background:#5a7086"></i>车轮（车外两侧）</span>
        <span><i style="background:#56c8d8"></i>电池/地板</span><span><i style="background:#8fb3cc"></i>座椅</span>
        <span><i style="background:#5fd08a"></i>床面</span><span><i style="background:#e8b0a0"></i>人体</span>
        <span><i style="background:#e8d174"></i>隔板/储物</span><span><i style="background:#4aa3ff"></i>升顶</span>
        <span style="color:#ff5b52">■红=硬约束失败</span><span style="color:#f0a35e">■橙=提醒</span>
      </div>
    </div>
  </div>
  <div class="right"><div class="ctrl" id="ctrl"></div></div>
</div>
<script>
/* =====================================================================
   世界坐标：x = 0(前保险杠) → L(车尾)，mm；y = 离地高度 mm。
   比例只在 SX()/SY() 里乘一次；绘制代码禁止出现"像素×比例"。
   几何由 builder 生成；校验判据引用同一份几何（docs/design/蓝图工具.md）。
   ===================================================================== */

const DEF = {
  L:   {v:4100,min:3300,max:5400,st:25, g:'车身', n:'全长 L'},
  W:   {v:1800,min:1500,max:2050,st:10, g:'车身', n:'外宽 W'},
  H:   {v:1900,min:1400,max:2000,st:10, g:'车身', n:'车高 H（不升顶）'},
  tdf: {v:660, min:550, max:780, st:2,  g:'底盘', n:'前轮直径'},
  tdr: {v:660, min:550, max:780, st:2,  g:'底盘', n:'后轮直径'},
  axF: {v:900, min:600, max:1500,st:10, g:'底盘', n:'前轴位（=前悬）'},
  axR: {v:2600,min:1700,max:4200,st:10, g:'底盘', n:'后轴位'},
  gf:  {v:140, min:100, max:260, st:5,  g:'底盘', n:'前离地'},
  gr:  {v:150, min:100, max:260, st:5,  g:'底盘', n:'后离地'},
  bt:  {v:300, min:120, max:360, st:5,  g:'底盘', n:'电池厚（=地板高）'},
  b0:  {v:1250,min:600, max:2400,st:10, g:'底盘', n:'电池前缘'},
  b1:  {v:2560,min:1600,max:4300,st:10, g:'底盘', n:'电池后缘'},
  bw:  {v:1200,min:800, max:1500,st:10, g:'底盘', n:'电池宽'},
  base:{v:150, min:0,   max:300, st:10, g:'前排座椅', n:'座垫离地板高'},
  fLift:{v:50,  min:-150,max:200, st:10, g:'前排座椅', n:'前座升降（-降 +升）'},
  xF:  {v:1850,min:900, max:2600,st:10, g:'前排座椅', n:'H 点 x（靠背铰点）'},
  fCl: {v:470, min:350, max:650, st:5,  g:'前排座椅', n:'座垫长'},
  fCa: {v:5,   min:-10, max:30,  st:1,  g:'前排座椅', n:'座垫角（前缘上翘）',deg:1},
  fBl: {v:600, min:400, max:800, st:5,  g:'前排座椅', n:'靠背长'},
  fBa: {v:14,  min:-10, max:60,  st:1,  g:'前排座椅', n:'靠背角（后仰为正）',deg:1},
  fCt: {v:150, min:80,  max:320, st:5,  g:'前排座椅', n:'坐垫厚'},
  xR:  {v:2920,min:1500,max:3600,st:10, g:'二排座椅', n:'H 点 x（靠背铰点）'},
  rLift:{v:0,   min:-150,max:200, st:10, g:'二排座椅', n:'二排升降（-降 +升）'},
  rCl: {v:470, min:350, max:700, st:5,  g:'二排座椅', n:'座垫长'},
  rCa: {v:5,   min:-10, max:30,  st:1,  g:'二排座椅', n:'座垫角（前缘上翘）',deg:1},
  rBl: {v:520, min:400, max:800, st:5,  g:'二排座椅', n:'靠背长'},
  rBa: {v:14,  min:-10, max:60,  st:1,  g:'二排座椅', n:'靠背角（坐姿）',deg:1},
  rCt: {v:200, min:80,  max:320, st:5,  g:'二排座椅', n:'坐垫厚'},
  rLl: {v:300, min:150, max:500, st:5,  g:'二排座椅', n:'腿托基础长（收起态）'},
  legExt:{v:300,min:0, max:500, st:10, g:'二排座椅', n:'腿托伸出量（做床时伸出）'},
  rLa: {v:70,  min:0,   max:90,  st:1,  g:'二排座椅', n:'腿托下垂角（收起态）',deg:1},
  fold:{v:0,   min:0,   max:1,   st:0.02,g:'二排座椅', n:'变形进度（0=坐姿 1=全平床）'},
  ix:  {v:1650,min:800, max:3600,st:10, g:'中岛',     n:'中岛 x'},
  iw:  {v:220, min:100, max:320, st:10, g:'中岛',     n:'中岛宽'},
  ihh: {v:620, min:360, max:820, st:10, g:'中岛',     n:'台面离地板高'},
  pAng:{v:0,   min:0,   max:90,  st:1,  g:'尾箱/隔板',n:'可翻隔板角（0平铺补床尾 90立起作尾柱隔断）',deg:1},
  ud:  {v:260, min:150, max:450, st:10, g:'尾箱/隔板',n:'尾仓下层深（湿区）'},
  flapLen:{v:260,min:150, max:500, st:10, g:'尾箱/隔板',n:'可翻隔板长'},
  px0: {v:1700,min:1200,max:3900,st:10, g:'升顶/吊柜',n:'升顶开口 前缘（自动限在车顶内）'},
  px1: {v:3550,min:1600,max:4100,st:10, g:'升顶/吊柜',n:'升顶开口 后缘'},
  pr:  {v:700, min:250, max:900, st:10, g:'升顶/吊柜',n:'升顶抬高'},
  lkD: {v:330, min:200, max:500, st:10, g:'升顶/吊柜',n:'吊柜深（横向）'},
  lkH: {v:300, min:150, max:400, st:10, g:'升顶/吊柜',n:'吊柜高'},
  scrX:{v:2150,min:1200,max:3900,st:10, g:'投影',    n:'幕布 x（挂在顶横梁）'},
  pjX: {v:3880,min:1600,max:4100,st:10, g:'投影',    n:'投影仪 x'},
  tr:  {v:1.5, min:0.8, max:2.2, st:0.05,g:'投影',    n:'投射比（宽:距）'},
};
const P = {}; for (const k in DEF) P[k] = DEF[k].v;
const M = { fbwd:false, pop:'closed', showDim:true, view:'2d' };

/* 人体关节表（175cm，说明：结构决策.md D6） */
const AN = { ankleY:80, kneeY:480, hipY:900, shdY:1420, topY:1750,
             shin:400, thigh:420, torso:520, headSeg:330, headR:115, hipAboveSeat:90,
             shW:460, legW:130, shinW:100, torsoW:230, armW:78, footW:80, footL:80 };

const D2R = Math.PI/180;
const lerp=(a,b,t)=>a+(b-a)*t;
/* --- 几何谓词：碰撞判定用同一份图元 --- */
function segSeg(a,b,c,e){
  const d1=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
  const d2=(b[0]-a[0])*(e[1]-a[1])-(b[1]-a[1])*(e[0]-a[0]);
  const d3=(e[0]-c[0])*(a[1]-c[1])-(e[1]-c[1])*(a[0]-c[0]);
  const d4=(e[0]-c[0])*(b[1]-c[1])-(e[1]-c[1])*(b[0]-c[0]);
  return ((d1>0)!==(d2>0))&&((d3>0)!==(d4>0));
}
function inQuad(p,q){ let s=0;
  for(let i=0;i<4;i++){ const a=q[i],b=q[(i+1)%4];
    const cr=(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);
    if(cr>1e-9) s|=1; else if(cr<-1e-9) s|=2; }
  return s!==3; }
function segQuad(a,b,q){ return inQuad(a,q)||inQuad(b,q)||q.some((_,i)=>segSeg(a,b,q[i],q[(i+1)%4])); }
function quadQuad(a,b){ return a.some(p=>inQuad(p,b))||b.some(p=>inQuad(p,a))||a.some((_,i)=>segQuad(a[i],a[(i+1)%4],b)); }
const ln  =(a,b,w,cls)=>        ({k:'line',a,b,w:w||0,cls:cls||'l0'});
const poly=(pts,cls,fill)=>     ({k:'poly',pts,cls:cls||'l0',fill:fill||''});
const rect=(x,y,w,h,cls,fill)=> poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],cls,fill);
const cir =(c,r,cls,fill)=>     ({k:'circle',c,r,cls:cls||'l0',fill:fill||''});
const txt =(x,y,s,cls,size,anchor)=>({k:'text',at:[x,y],s,cls:cls||'txt',size:size||10,anchor:anchor||'middle'});

/* ============================ build ============================ */
function build(p, m){
  const g=[], d={}, FOLD=p.fold, POP=m.pop;

  d.floor = p.gf + p.bt;                       // 地板上表面 = 电池顶面
  d.bedTopEarly = d.floor + p.base + p.rCt + p.rLift;   // 床面高（座椅 builder 需要先用）
  d.archRF = p.tdf/2 + 60; d.archRR = p.tdr/2 + 60;
  d.archF = {c:[p.axF, p.gf+p.tdf/2], r:d.archRF, top:p.gf+p.tdf+60, wheelTop:p.gf+p.tdf};
  d.archR = {c:[p.axR, p.gr+p.tdr/2], r:d.archRR, top:p.gr+p.tdr+60, wheelTop:p.gr+p.tdr};
  d.archFtop = p.gf + p.tdf + 60; d.archRtop = p.gr + p.tdr + 60;
  d.rocker = Math.min(p.gf,p.gr) + 30;

  /* ---------- 车轮（车外两侧）---------- */
  for (const [ax,td,gc,tag] of [[p.axF,p.tdf,p.gf,'前轮'],[p.axR,p.tdr,p.gr,'后轮']]){
    const r=td/2, cy=gc+r;
    g.push(cir([ax,cy], r, 'tyre','#0a0f14'));
    g.push(cir([ax,cy], r*0.55, 'rim'));
    for(let a=0;a<6;a++){const t=a*Math.PI/3;
      g.push(ln([ax+Math.cos(t)*r*0.55, cy+Math.sin(t)*r*0.55],[ax+Math.cos(t)*r*0.9, cy+Math.sin(t)*r*0.9],22,'rim'));}
    g.push(txt(ax, -140, `${tag} Ø${td}`,'txt',10));
    g.push(txt(ax, -270, `包顶 ${Math.round(gc+td+60)}`,'txt',9));
  }

  /* ---------- 座椅（前后共用一套；朝向参数化）---------- */
  function seat(row, fOld){
    const F = row==='front';
    const FOLDx = (fOld==null? FOLD : fOld);
    const HX = F? p.xF : p.xR;
    const CL = F? p.fCl: p.rCl;
    const CA = ((F? p.fCa : p.rCa * (1-FOLDx)))*D2R;          // 二排放平时坐垫角归零
    const BL = F? p.fBl: p.rBl;
    const bedM = FOLD > 0.5;
    const BA0 = F ? ((m.fbwd && bedM) ? Math.max(p.fBa, 50) : p.fBa) : (p.rBa*(1-FOLDx) + 90*FOLDx);
    const BA = BA0*D2R;                        // 二排放平=水平；前排旋转+做床→贵妃榻
    const CT = F? p.fCt: p.rCt;
    const topY = d.floor + p.base + CT + (F? p.fLift : 0);   // 前座可用 fLift 对齐床面
    const face = F ? (m.fbwd ? -1 : 1) : 1;                  // +1 朝车头
    const axisX = HX - CL/2;                                 // 旋转轴（座垫中点）
    const mx = x => face===1 ? x : 2*axisX - x;              // 180° 旋转
    const cfx = HX - CL*Math.cos(CA);                        // 坐垫前缘
    const cfy = topY + CL*Math.sin(CA);
    const cush = {p0:[mx(HX),topY], p1:[mx(cfx),cfy],
                  sh:[[mx(HX),topY],[mx(cfx),cfy],[mx(cfx),cfy-CT],[mx(HX),topY-CT]]};
    const bx = face===1 ? Math.sin(BA) : -Math.sin(BA);
    const by = Math.cos(BA);
    const b0=[HX,topY], b1=[HX+BL*bx, topY+BL*by];
    const nx = face===1 ? Math.cos(BA) : -Math.cos(BA);
    const ny = -Math.sin(BA);
    const BTh = Math.max(60, CT*0.7);
    const back={p0:b0,p1:b1,ang:BA,dir:[bx,by],
                sh:[b0,b1,[b1[0]+nx*BTh,b1[1]+ny*BTh],[b0[0]+nx*BTh,b0[1]+ny*BTh]]};
    const hd ={p0:b1,p1:[b1[0]+180*bx,b1[1]+180*by],
               sh:[b1,[b1[0]+180*bx,b1[1]+180*by],[b1[0]+180*bx+nx*BTh*1.1,b1[1]+180*by+ny*BTh*1.1],[b1[0]+nx*BTh*1.1,b1[1]+ny*BTh*1.1]]};
    let leg=null;
    if (!F){
      const LA = (p.rLa*(1-FOLDx))*D2R;
      const legLen = p.rLl + p.legExt*FOLDx;      // 收起=基础长，做床=伸出（真车腿托就是伸缩的）
      const hp = [mx(cfx), cfy];
      const tipX = hp[0] + (face===1?-1:1)*(legLen*Math.cos(LA));
      const tipY = cfy - legLen*Math.sin(LA);
      const th = Math.max(40, CT*0.45);
      leg = {hp, tip:[tipX,tipY], LA, len:legLen,
             sh:[[hp[0],hp[1]],[tipX,tipY],[tipX,tipY-th],[hp[0],hp[1]-th]]};
    }
    const base0=Math.min(mx(HX),mx(cfx))+40, base1=Math.max(mx(HX),mx(cfx))-40;
    const baseQ=[[base0,d.floor],[base1,d.floor],[base1,topY-CT],[base0,topY-CT]];
    return {row,F,HX,CL,CA,BL,BA,CT,topY,face,axisX,hinge:[HX,topY],baseQ,base0,base1,
            footY: F ? ((m.fbwd && bedM) ? d.bedTopEarly : d.floor) : d.floor,
            cush, back, head:hd, leg, mx};
  }
  d.front = seat('front');
  d.rear  = seat('rear');
  d.rearFlat = seat('rear',1);        // 放平态（床长/碰撞判据用，与当前 fold 无关）

  /* ---------- 人体（关节链，头永不脱离躯干）---------- */
  function human(s){
    const f = s.face, fl = s.F ? 0 : FOLD;          // 前排不参与变形
    const hip = [s.hinge[0] - f*8, s.topY + AN.hipAboveSeat];
    const knee= [hip[0] - f*AN.thigh*Math.cos(s.CA), hip[1] + AN.thigh*Math.sin(s.CA)];
    // 踝：坐姿落在支撑面（地板 / 贵妃榻时为床面），fl→沿腿托伸平
    const drop = knee[1] - (s.footY + AN.ankleY);
    const reach = Math.sqrt(Math.max(0, AN.shin*AN.shin - drop*drop));
    const sitAnkle = [knee[0] - f*reach, s.footY + AN.ankleY];
    const lieAnkle = s.leg ? [s.leg.tip[0] - f*140, s.leg.tip[1] + 26] : [knee[0] - f*AN.shin, knee[1]];
    let ank = [lerp(sitAnkle[0],lieAnkle[0],fl), lerp(sitAnkle[1],lieAnkle[1],fl)];
    let vx=ank[0]-knee[0], vy=ank[1]-knee[1], L=Math.hypot(vx,vy)||1, over=false;
    const need=L; if (L>AN.shin+1){ vx*=AN.shin/L; vy*=AN.shin/L; over=true; }
    const ankle=[knee[0]+vx, knee[1]+vy];
    const toeDir = f>0 ? -1 : 1;                      // 脚尖朝座椅前方
    const foot=[ankle[0]+toeDir*AN.footL, ankle[1]+8];
    const bd=s.back.dir;
    const shd=[hip[0]+bd[0]*AN.torso, hip[1]+bd[1]*AN.torso];
    const headC=[shd[0]+bd[0]*215, shd[1]+bd[1]*215];
    const elbow=[shd[0]+bd[0]*150 + toeDir*100, shd[1]-140];
    const handSit=[knee[0]-toeDir*30, knee[1]+120];
    const handLie=[hip[0]+bd[0]*300, hip[1]+bd[1]*300];
    const hand=[lerp(handSit[0],handLie[0],fl), lerp(handSit[1],handLie[1],fl)];
    return {hip,knee,ankle,foot,shd,headC,elbow,hand,over,need,face:f,seat:s};
  }
  d.humanF = human(d.front);
  d.humanR = human(d.rear);

  /* ---------- 床面 / 尾台 / 固定隔板 / 可翻隔板 ---------- */
  d.bedTop = d.bedTopEarly;
  d.bedFlatTip = d.rearFlat.leg.tip[0];      // 放平后腿托前端（跨过脚部空洞）
  d.bedBackTip = d.rearFlat.back.p1[0];      // 放平后靠背尾端
  d.deckX0 = d.bedBackTip;                    // 固定隔板/二层平台：无缝接靠背
  d.deckX1 = (p.L-90) - p.flapLen;            // 可翻隔板铰点
  d.deckLen = d.deckX1 - d.deckX0;
  d.lowFloor = d.bedTop - p.ud;
  d.frontCushRearX  = Math.max(d.front.cush.p0[0], d.front.cush.p1[0]);
  d.frontCushFrontX = Math.min(d.front.cush.p0[0], d.front.cush.p1[0]);
  d.seamGap  = d.frontCushRearX - d.bedFlatTip;      // 0 = 与前座垫无缝
  d.levelDiff= d.bedTop - d.front.topY;              // 0 = 与前座面齐平
  d.bedFrontX= m.fbwd ? d.frontCushFrontX : d.bedFlatTip;
  d.bedRun   = (p.L-90) - d.bedFrontX;
  d.rowGap   = (p.xR - p.rCl) - d.frontCushRearX;    // 两排净间距（会客桌板）
  d.colH     = p.H - d.lowFloor;                     // 尾柱净高（竖放可两层）
  d.bedMode  = FOLD > 0.5;
  d.chaise   = m.fbwd && d.bedMode;                  // 前排被迫贵妃榻
  d.usableW  = p.W - 2*p.lkD;                        // 吊柜之间净宽 = 幕布宽度上限
  d.throwD   = Math.abs(p.pjX - p.scrX);
  d.scrW     = Math.min(d.usableW, d.throwD / p.tr);
  d.scrH     = d.scrW * 9/16;
  d.scrIn    = Math.round(Math.hypot(d.scrW, d.scrH)/25.4);

  /* ---------- 升顶 ---------- */
  d.cowlX = Math.max(p.axF+220, d.front.cush.p1[0]-120);
  d.cowlY = d.front.topY + 320;
  d.roofX0 = Math.min(d.cowlX + (p.H-d.cowlY)*0.36, p.L-900);
  d.roofX1 = p.L - 430;
  d.px1 = Math.min(p.px1, d.roofX1-60);
  d.px0 = Math.max(p.px0, d.roofX0+60);
  if (d.px1 - d.px0 < 600) d.px1 = Math.min(d.roofX1-60, d.px0+600);
  d.footPit = d.floor + p.base - (d.floor + AN.ankleY + AN.footW/2);   // 前排座下净高余量
  d.popTop = p.H + (POP==='closed' ? 0 : p.pr);
  d.bunkY = p.H - 20;
  d.standNeed = d.bedTop + AN.topY + 60;
  d.standZone = Math.max(0, Math.min(p.L-90, d.px1) - Math.max(d.bedFrontX, d.px0));  // 床面上可站立区
  d.sweepTop  = d.front.topY + p.fBl + 160;               // 旋转扫掠最高点（靠背竖立+头枕）

  /* ============================ 图元 ============================ */
  /* 车身外轮廓（含真实轮包缺口：弧心=轮心） */
  const archCut=(ax,td,gc,rev)=>{
    const cy=gc+td/2, R=td/2+60, dy=cy-d.rocker;
    const dx=Math.sqrt(Math.max(1,R*R-dy*dy));
    const a0=Math.atan2(dy,-dx), a1=Math.atan2(dy,dx), out=[], N=18;
    for(let i=0;i<=N;i++){ const t=rev?1-i/N:i/N, a=a0+(a1-a0)*t;
      out.push([ax+Math.cos(a)*R, cy+Math.sin(a)*R]); }
    return {pts:out, dx};
  };
  const afF=archCut(p.axF,p.tdf,p.gf,true), afR=archCut(p.axR,p.tdr,p.gr,true);
  const bPts=[[0,p.gf],[0,p.gf+560],[p.axF-140,p.gf+700],[d.cowlX,d.cowlY],[d.roofX0,p.H],[d.roofX1,p.H],
              [p.L-140,p.gr+700],[p.L,p.gr+430],[p.L,p.gr],
              [p.axR+afR.dx,d.rocker], ...afR.pts, [p.axF+afF.dx,d.rocker], ...afF.pts, [0,d.rocker]];
  d.bodyPts=bPts;
  g.push(poly(bPts,'body','#0f151d'));
  const belt=Math.max(d.cowlY+120, d.front.topY+150);
  g.push(poly([[d.cowlX+70,belt],[d.roofX0+95,p.H-45],[d.roofX1-120,p.H-45],[p.L-320,p.H-300],[p.L-320,belt]],'glass','#0a2436'));

  /* 电池 + 地板 */
  if (p.b1>p.b0){
    g.push(rect(p.b0,p.gf,p.b1-p.b0,p.bt,'batt','#132434'));
    g.push(txt((p.b0+p.b1)/2, p.gf+p.bt/2+4, `电池 ${p.b0}–${p.b1} ×宽${p.bw} ≈${Math.round((p.b1-p.b0)*p.bw*p.bt*160/1e9)}kWh`,'batt-t',11));
  }
  g.push(ln([60,d.floor],[p.L-90,d.floor],26,'floor'));

  /* 前备箱（说明书第二章） */
  g.push(rect(p.axF-260, p.gf+190, 400, 150,'store2','none'));
  g.push(txt(p.axF-60, p.gf+165,'前备箱（一级脏区）','store-t',10));

  /* 轮位机能区：前后轴切片全被机械占满（前=转向/48V/AC+溃缩件，后=同轴三电） */
  for (const [ax,arc,tag,note] of [[p.axF,d.archF,'前轮位','转向/48V/AC·溃缩件'],[p.axR,d.archR,'后轮位','同轴三电（电机+减速+逆变）']]){
    g.push(rect(ax-arc.r, p.gf, 2*arc.r, arc.r, 'slice','none'));
    g.push(txt(ax, arc.top+40, `${tag}：${note}`,'slice-t',9.5));
  }

  /* 尾仓：一层湿区（可冲洗）+ 固定隔板/二层平台 + 可翻隔板 */
  g.push(rect(d.deckX0, d.lowFloor, (p.L-90)-d.deckX0, p.ud,'wet','#0e2430'));
  g.push(txt((d.deckX0+p.L)/2, d.lowFloor+20, `一层湿区 深${p.ud}·可冲洗`,'wet-t',10));
  g.push(ln([d.deckX0,d.bedTop],[d.deckX1,d.bedTop],22,'deck'));
  g.push(txt((d.deckX0+d.deckX1)/2, d.bedTop-28, `固定隔板/二层平台 ${Math.round(d.deckLen)}`,'bed-t',9.5));
  /* 可翻隔板：铰在 deckX1；0°=平铺补床尾，90°=立起成尾柱隔断 */
  const pa=p.pAng*D2R;
  const fTip=[d.deckX1 + p.flapLen*Math.cos(pa), d.bedTop - p.flapLen*Math.sin(pa)];
  const fN=[Math.sin(pa), Math.cos(pa)], fTh=40;
  g.push(poly([[d.deckX1,d.bedTop],fTip,[fTip[0]+fN[0]*fTh,fTip[1]+fN[1]*fTh],[d.deckX1+fN[0]*fTh,d.bedTop+fN[1]*fTh]],'part','#3a3320'));
  g.push(cir([d.deckX1,d.bedTop],14,'pin'));
  g.push(txt(fTip[0], fTip[1]-40, `可翻隔板 ${p.pAng}°`,'part-t',10,fTip[0]>p.L-600?'end':'middle'));
  if (p.pAng>45) g.push(txt((d.deckX1+p.L)/2, p.H-60, `尾柱净高 ${Math.round(d.colH)}·竖放可两层`,'part-t',10));

  /* 床面（变形中/放平后）：前座垫 + 腿托 + 座垫 + 靠背 + 固定隔板 + 可翻隔板 */
  if (FOLD>0.02){
    g.push(ln([d.bedFrontX,d.bedTop],[p.L-90,d.bedTop],26,'bed'));
    const segs=[['前座垫',d.frontCushFrontX,d.frontCushRearX],['腿托',d.bedFlatTip,p.xR],
                ['二排座垫',p.xR,p.xR+p.rCl],['二排靠背',p.xR+p.rCl,d.bedBackTip],
                ['固定隔板',d.deckX0,d.deckX1],['可翻隔板',d.deckX1,p.L-90]];
    for (const [s0,a,b] of segs) if (b-a>40) g.push(txt((a+b)/2, d.bedTop-28, `${s0}${Math.round(b-a)}`,'bed-t',9.5));
    g.push(txt(p.L/2, d.bedTop+200, `可睡长度 ${Math.round(d.bedRun)}（👤1750）`,'bed-t',11));
  }

  /* 会客模式：跨行桌板（搭在墙面榫卯上，不用时从下层仓取） */
  if (m.fbwd && !d.bedMode){
    const tY=d.rear.topY+280;
    d.table={x0:d.frontCushRearX, x1:p.xR-p.rCl, top:tY, overSeat:tY-d.rear.topY};
    g.push(rect(d.table.x0, tY-60, d.table.x1-d.table.x0, 60,'tbl','#26333f'));
    g.push(txt((d.table.x0+d.table.x1)/2, tY+26, `跨行桌板 深${Math.round(d.rowGap)} · 台面离地 ${Math.round(tY)}`,'tbl-t',10));
  }

  /* 座椅 */
  for (const s of [d.front,d.rear]){
    const cls=(s.F && m.fbwd)?'seat-o':'seat';
    g.push(poly(s.cush.sh,cls,'#22303e'));
    g.push(poly(s.back.sh,cls,'#22303e'));
    g.push(poly(s.head.sh,cls,'#22303e'));
    if (s.leg) g.push(poly(s.leg.sh,'seat','#22303e'));
    g.push(poly(s.baseQ,'seatbase','#1a232e'));
    g.push(cir(s.hinge,15,'pin'));
    if (s.leg) g.push(cir(s.leg.hp,15,'pin'));
  }

  /* 中岛 */
  const ix0=p.ix-p.iw/2, tabY=d.floor+p.ihh;
  d.isl={ix:p.ix, ix0, iw:p.iw, tabY, overSeat:tabY-d.rear.topY};
  g.push(rect(ix0,d.floor,p.iw,tabY-d.floor-90,'isl','#241d2e'));
  g.push(rect(ix0-20,tabY-90,p.iw+40,90,'isl-top','#332842'));
  g.push(txt(ix0+p.iw+16, tabY-40, `中岛台面离地 ${Math.round(tabY)}`,'isl-t',10,'start'));

  /* 人体 */
  const man=(h,cls)=>{
    g.push(ln(h.hip,h.knee,AN.legW,cls));
    g.push(ln(h.knee,h.ankle,AN.shinW,cls));
    g.push(ln(h.ankle,h.foot,AN.footW,cls));
    g.push(ln(h.hip,h.shd,AN.torsoW,cls));
    g.push(ln(h.shd,h.elbow,AN.armW,cls));
    g.push(ln(h.elbow,h.hand,AN.armW,cls));
    g.push(cir(h.headC,AN.headR,cls,'#e8b0a0'));
  };
  if (d.bedMode && m.pop!=='stand'){
    /* 床面上的人：关节链平铺，头在床首（前座垫上），脚朝车尾（决策：床面前段=前座垫）*/
    const bx=d.bedFrontX+300, y0=d.bedTop, cls='man-r';
    const shd=bx+330, hip=shd+AN.torso, knee=hip+AN.thigh, ankle=knee+AN.shin, toe=ankle+AN.footL;
    g.push(ln([shd,y0+115],[hip,y0+115],AN.torsoW,cls));
    g.push(ln([hip,y0+65],[knee,y0+65],AN.legW,cls));
    g.push(ln([knee,y0+55],[ankle,y0+55],AN.shinW,cls));
    g.push(ln([ankle,y0+40],[toe,y0+40],AN.footW,cls));
    g.push(ln([shd,y0+150],[shd+250,y0+150],AN.armW,cls));
    g.push(cir([bx,y0+AN.headR],AN.headR,cls,'#e8b0a0'));
    g.push(txt(bx+330, y0+330, '👤1750 头在床首', 'bed-t',10));
    g.push(txt(toe+150, y0+150, `脚端余量 ${Math.round((p.L-90)-toe)}`, 'bed-t',9.5,'start'));
  } else {
    if (m.pop!=='stand') man(d.humanR,'man-r');   // 站姿模式：床面留空给站立
    man(d.humanF,'man-f');
  }

  /* 升顶 + 吊柜 */
  const gx=d.px0, gy=d.px1-0;
  if (POP==='closed'){
    g.push(ln([gx,p.H],[gy,p.H],34,'pop'));
    g.push(txt((gx+gy)/2, p.H+40, `升顶闭合（可抬 ${p.pr}）`,'pop-t',10));
  } else {
    g.push(ln([gx,p.H],[gx,d.popTop],16,'tent'));
    g.push(ln([gx,d.popTop],[gy,d.popTop],30,'pop'));
    g.push(ln([gx,d.popTop],[gy,p.H],0,'none'));
    g.push(ln([gx+80,p.H+110],[gx+80,d.popTop-120],0,'tent'));
    g.push(ln([gy-80,p.H+110],[gy-80,d.popTop-120],0,'tent'));
    g.push(txt((gx+gy)/2, d.popTop+40, `玻璃顶盖 +${p.pr} · 开口 ${Math.round(gy-gx)}`,'pop-t',10));
    if (POP==='bunk'){
      g.push(ln([gx,d.bunkY],[gy,d.bunkY],26,'bunk'));
      g.push(txt((gx+gy)/2,d.bunkY-40,'上铺板：搭在两侧壁面 + 顶横梁（1 大人 + 1 小孩）','bunk-t',10));
      const bx=gy-460, sy=d.bunkY+30;
      g.push(ln([bx,sy],[bx-AN.thigh,sy],AN.legW,'man-b'));
      g.push(ln([bx,sy],[bx+AN.shin,sy],AN.shinW,'man-b'));
      g.push(ln([bx,sy+35],[bx-AN.torso,sy+35],AN.torsoW,'man-b'));
      g.push(cir([bx-AN.torso-215,sy+35],AN.headR,'man-b','#7fc4ff'));
    } else {
      const sx=(gx+gy)/2;
      g.push(ln([sx,d.bedTop+AN.ankleY],[sx,d.bedTop+AN.kneeY],AN.shinW,'man-b'));
      g.push(ln([sx,d.bedTop+AN.kneeY],[sx,d.bedTop+AN.hipY],AN.legW,'man-b'));
      g.push(ln([sx,d.bedTop+AN.hipY],[sx,d.bedTop+AN.shdY],AN.torsoW,'man-b'));
      g.push(cir([sx,d.bedTop+AN.shdY+215],AN.headR,'man-b','#7fc4ff'));
      g.push(txt(sx, d.bedTop+AN.topY+150,'站在床面上（不升顶只能坐）','man-bt',10));
    }
  }
  g.push(rect(d.roofX0+130, p.H-p.lkH, d.roofX1-d.roofX0-260, p.lkH,'lk','none'));
  g.push(txt(d.roofX0+170, p.H-p.lkH-16, `两侧吊柜 ×2 深${p.lkD} 高${p.lkH}（中间净空）`,'lk-t',10,'start'));

  /* 顶横梁（升顶开口前后缘）——挂幕布卷筒、上铺板搭接都靠它 */
  for (const bx of [d.px0, d.px1]) g.push(rect(bx-45, p.H-130, 90, 130,'cross','#2b3a48'));
  g.push(txt(d.px1+70, p.H-70, '顶横梁 ×2','cross-t',10,'start'));

  /* 投影：卷帘幕布挂在顶横梁，投影仪在车尾 */
  const scTop=p.H-130, scBot=scTop-d.scrH;
  g.push(rect(p.scrX-30, scTop, 60, 40,'scr','#333'));
  g.push(ln([p.scrX,scTop],[p.scrX,scBot],10,'scr'));
  g.push(txt(p.scrX, scBot-30, `幕布 ${d.scrIn}″（宽${Math.round(d.scrW)}×高${Math.round(d.scrH)}）`,'scr-t',10));
  g.push(rect(p.pjX-70, p.H-260, 140, 110,'pj','#2b2033'));
  g.push(txt(p.pjX, p.H-290, '投影仪','pj-t',10));
  g.push(ln([p.scrX,scBot-10],[p.pjX,p.H-150],0,'beam'));
  g.push(txt((p.scrX+p.pjX)/2, scBot-70, `投射距离 ${Math.round(d.throwD)} · 投射比 ${p.tr}`,'beam-t',10));

  /* 尺寸链 */
  if (m.showDim){
    const chain=[[0,'0'],[d.floor,'地板'],[d.front.topY,'前座面'],[d.rear.topY,'二排座面'],[p.H,'车高']];
    if (POP!=='closed') chain.push([d.popTop,'升顶']);
    g.push(ln([-150,0],[-150,Math.max(p.H,d.popTop)+140],8,'dim'));
    for (const [y,t] of chain){ g.push(ln([-185,y],[-115,y],8,'dim')); g.push(txt(-200,y+4,`${t} ${Math.round(y)}`,'dim-t',9.5,'end')); }
    g.push(ln([0,-170],[p.L,-170],8,'dim')); g.push(txt(p.L/2,-195,`全长 ${p.L}`,'dim-t',10));
    g.push(ln([0,-310],[p.axF,-310],8,'dim')); g.push(txt(p.axF/2,-328,`前悬 ${p.axF}`,'dim-t',9.5));
    g.push(ln([p.axF,-310],[p.axR,-310],8,'dim')); g.push(txt((p.axF+p.axR)/2,-328,`轴距 ${Math.round(p.axR-p.axF)}`,'dim-t',9.5));
    g.push(ln([p.axR,-310],[p.L,-310],8,'dim')); g.push(txt((p.axR+p.L)/2,-328,`尾悬 ${Math.round(p.L-p.axR)}`,'dim-t',9.5));
    for (const s of [d.front,d.rear]){
      const dd=s.back.dir, len=230;
      g.push(ln(s.back.p0,[s.back.p0[0]+dd[0]*len, s.back.p0[1]+dd[1]*len],5,'ang'));
      g.push(txt(s.back.p0[0]+dd[0]*(len+80), s.back.p0[1]+dd[1]*(len+120), `${s.F?'前排':'二排'}靠背 ${Math.round(s.back.ang/D2R)}°`,'ang-t',9.5));
    }
  }
  return {prims:g, d, p, m};
}

/* ============================ 校验 ============================ */
function checks(p,m,B){
  const d=B.d, out=[];
  const H=(id,ok,t,bad,fix)=>out.push({id,ok,lv:'hard',t:ok?t:bad,fix});
  const S=(id,ok,t,bad,fix)=>out.push({id,ok,lv:'soft',t:ok?t:bad,fix});
  const I=(id,t)=>out.push({id,ok:true,lv:'info',t,fix:''});
  const R=Math.round;

  H('C1', d.bedRun>=1750, `放平后可睡 ${R(d.bedRun)} ≥ 1750`,
      `放平后只有 ${R(d.bedRun)} 可睡（需 ≥1750）`, 'xR/rCl/rLl/rBl/L');
  H('C2', d.deckLen>=200, `尾台 ${R(d.deckLen)} ≥ 200`,
      `尾台只剩 ${R(d.deckLen)}（靠背/隔板越过尾门）`, 'xR/rBl/ud/L');
  if (m.pop==='stand') H('C3', d.popTop>=d.standNeed, `站姿净空 ${R(d.popTop)} ≥ ${R(d.standNeed)}`,
      `站姿不够：pr 再加 ${R(d.standNeed-d.popTop)}`, 'pr');
  else I('C3', `站立所需 pr ≥ ${R(d.standNeed-p.H)}（现 ${p.pr}）`);
  if (m.pop==='bunk') H('C4', p.pr>=480, `上铺净空 ${p.pr} ≥ 480`, `上铺净空不足 ${p.pr} < 480`, 'pr');
  H('C5', d.bedTop+960<=p.H, `床面坐姿净空 ${R(d.bedTop+960)} ≤ 车高 ${p.H}`,
      `床面坐姿不够（${R(d.bedTop+960)} > ${p.H}）`, 'H/rCt/bt');
  for (const [tag,h0,name] of [['F',d.humanF,'前排'],['R',d.humanR,'二排']]){
    const top=h0.headC[1]+AN.headR;
    H('C6'+tag, top<=p.H-30, `${name}头顶 ${R(top)} ≤ ${p.H-30}`, `${name}头顶 ${R(top)} 穿顶（车高 ${p.H}）`, 'H/fBl/fBa/fCt');
    S('C10'+tag, !h0.over, `${name}脚落在支撑面上`, `${name}脚够不到支撑（小腿差 ${R(h0.need-AN.shin)}mm）`, 'fCt/rCt/bt/gf');
  }
  S('C7', d.front.cush.p1[0] >= p.axF+d.archRF-60,
    `前排坐垫前缘 ${R(d.front.cush.p1[0])} 避开前轮包（包后缘 ${R(p.axF+d.archRF)}）`,
    `前排坐垫压在前轮包上（前缘 ${R(d.front.cush.p1[0])} < 包后缘 ${R(p.axF+d.archRF)}）— 挤占脚部横向空间`, 'xF/fCl/axF');
  const inner=p.W-2*190;
  H('C8', p.bw<=inner, `电池宽 ${p.bw} ≤ 轮包内间距 ${inner}`, `电池宽 ${p.bw} > 轮包内间距 ${inner}`, 'bw/W');
  H('C9', p.b0>=p.axF && p.b1<=p.axR, `电池在前后轴之间（${p.b0}–${p.b1}）`,
    `电池越出轴间（前轴 ${p.axF} / 后轴 ${p.axR}）`, 'b0/b1/axF/axR');
  const tab=d.floor+p.ihh-d.rear.topY;
  H('C11', tab>=250&&tab<=340, `台面高出座面 ${R(tab)}（餐桌 250–340）`,

/* ============================ 3D：可旋转正交视图 ============================
   世界：x=车长，y=离地高，z=车宽(0=中线)。鼠标拖动旋转、滚轮缩放。
   面级排序 + 法线着色 —— 即使全是同色也能看出体积关系。 */
const CAM={az:300, el:14, zoom:1, shell:0.14};
const _d2r=Math.PI/180;

function primFaces(b){                      // 体块 → 面（世界坐标）
  const out=[], Q=(p0,p1,p2,p3)=>out.push([p0,p1,p2,p3]);
  if (b.k==='box'){
    const v=(i,j,k)=>[i?b.x1:b.x0, j?b.y1:b.y0, k?b.z1:b.z0];
    Q(v(0,0,0),v(1,0,0),v(1,1,0),v(0,1,0)); Q(v(0,0,1),v(1,0,1),v(1,1,1),v(0,1,1));
    Q(v(0,0,0),v(1,0,0),v(1,0,1),v(0,0,1)); Q(v(0,1,0),v(1,1,0),v(1,1,1),v(0,1,1));
    Q(v(0,0,0),v(0,1,0),v(0,1,1),v(0,0,1)); Q(v(1,0,0),v(1,1,0),v(1,1,1),v(1,0,1));
  } else if (b.k==='prism'){
    out.push(b.pts.map(q=>[q[0],q[1],b.z0]));
    out.push(b.pts.map(q=>[q[0],q[1],b.z1]).reverse());
    for (let i=0;i<b.pts.length;i++){ const j=(i+1)%b.pts.length, p=b.pts[i], q=b.pts[j];
      Q([p[0],p[1],b.z0],[q[0],q[1],b.z0],[q[0],q[1],b.z1],[p[0],p[1],b.z1]); }
  } else if (b.k==='cyl'){
    const N=18, pt=(t,z)=>[b.cx+Math.cos(t)*b.r, b.cy+Math.sin(t)*b.r, z];
    for (let i=0;i<N;i++){ const t0=i/N*Math.PI*2, t1=(i+1)/N*Math.PI*2;
      Q(pt(t0,b.z0),pt(t0,b.z1),pt(t1,b.z1),pt(t1,b.z0)); }
    const c0=[], c1=[];
    for (let i=0;i<N;i++){ const t=i/N*Math.PI*2; c0.push(pt(t,b.z0)); c1.push(pt(t,b.z1)); }
    out.push(c0); out.push(c1.reverse());
  }
  return out;
}
function buildFaces(B3){
  const SHELL=new Set(['body3','glass3','tent3']);
  const f=[];
  for (const b of B3){
    if (b.cls==='none3') continue;
    if (b.cls==='arch3' && !M3.showSlice) continue;
    if (SHELL.has(b.cls) && CAM.shell<=0.001) continue;
    for (const pts of primFaces(b)) f.push({pts, cls:b.cls, shell:SHELL.has(b.cls)});
  }
  return f;
}
const M3={showSlice:true};
const hexRGB=h=>{const n=parseInt((h||'#8899aa').replace('#',''),16);return [n>>16&255,n>>8&255,n&255];};
let FACES=null, FCAM=null;
function draw3(){
  if (!FACES) return;
  const NS='http://www.w3.org/2000/svg', svg=$('sv');
  svg.replaceChildren();
  const az=CAM.az*_d2r, el=CAM.el*_d2r;
  const dir=[Math.cos(el)*Math.cos(az), Math.sin(el), Math.cos(el)*Math.sin(az)];
  const right=[-Math.sin(az),0,Math.cos(az)];
  const upv=[-Math.sin(el)*Math.cos(az), Math.cos(el), -Math.sin(el)*Math.sin(az)];
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  // 投影（正交）：先定中心与比例
  let sx0=1e9,sx1=-1e9,sy0=1e9,sy1=-1e9;
  let ctr=[0,0,0], n0=0;
  for (const f of FACES) for (const p of f.pts){ ctr[0]+=p[0]; ctr[1]+=p[1]; ctr[2]+=p[2]; n0++; }
  ctr=ctr.map(v=>v/n0);
  const P1=(p)=>{ const q=[p[0]-ctr[0],p[1]-ctr[1],p[2]-ctr[2]];
    return [dot(q,right), dot(q,upv), dot(q,dir)]; };
  for (const f of FACES) for (const p of f.pts){ const q=P1(p);
    if(q[0]<sx0)sx0=q[0]; if(q[0]>sx1)sx1=q[0]; if(q[1]<sy0)sy0=q[1]; if(q[1]>sy1)sy1=q[1]; }
  const k=Math.min((SVGW-2*PAD)/Math.max(1,sx1-sx0), (SVGH-2*PAD)/Math.max(1,sy1-sy0))*CAM.zoom;
  const ox=SVGW/2-((sx0+sx1)/2)*k, oy=SVGH/2+((sy0+sy1)/2)*k;
  const SXY=(p)=>{ const q=P1(p); return [ox+q[0]*k, oy-q[1]*k]; };
  const LIGHT=[0.42,0.86,0.30];
  const add=(tag,at)=>{const e=document.createElementNS(NS,tag);
    for(const k2 in at) if(at[k2]!=null) e.setAttribute(k2,at[k2]); svg.appendChild(e); return e;};
  const bg=add('rect',{x:0,y:0,width:SVGW,height:SVGH,fill:'#161d26'}); void bg;
  // 面按深度排序（远→近），两面着色（与观察方向无关，避免法线绕向问题）
  const list=FACES.map(f=>{
    const q=f.pts.map(P1);
    const depth=q.reduce((a,b)=>a+b[2],0)/q.length;
    const n=[0,0,0];
    for (let i=0;i<f.pts.length;i++){ const a=f.pts[i], b=f.pts[(i+1)%f.pts.length];
      n[0]+=(a[1]-b[1])*(a[2]+b[2]); n[1]+=(a[2]-b[2])*(a[0]+b[0]); n[2]+=(a[0]-b[0])*(a[1]+b[1]); }
    const nl=Math.hypot(n[0],n[1],n[2])||1; const nn=n.map(v=>v/nl);
    const sgn=dot(nn,dir)>=0?1:-1;
    const lam=0.34+0.66*Math.max(0, sgn*dot(nn,LIGHT));
    return {f, depth, lam, q};
  }).sort((a,b)=>a.depth-b.depth);
  for (const it of list){
    const st=S3[it.f.cls]||S3.floor3;
    const rgb=hexRGB(GLB_STYLE[it.f.cls]||st.fill);
    const a=(st['fill-opacity']!=null?st['fill-opacity']:0.96)*(it.f.shell?1:1);
    const col=`rgb(${Math.round(rgb[0]*it.lam)},${Math.round(rgb[1]*it.lam)},${Math.round(rgb[2]*it.lam)})`;
    const d='M'+it.q.map(p=>`${(ox+p[0]*k).toFixed(1)},${(oy-p[1]*k).toFixed(1)}`).join('L')+'Z';
    add('path',{d, fill:col, 'fill-opacity':(it.f.shell?CAM.shell:a), stroke:st.stroke||'#000',
      'stroke-width':it.f.shell?0.8:0.9, 'stroke-opacity':it.f.shell?0.5:0.65});
  }
  add('text',{x:18,y:26,fill:'#8fb3cc','font-size':12},
      `3D 正交 · 方位 ${Math.round(CAM.az)}° 仰角 ${Math.round(CAM.el)}° · 外壳 ${Math.round(CAM.shell*100)}% · 拖动旋转 / 滚轮缩放`);
  add('text',{x:18,y:SVGH-14,fill:'#5c7386','font-size':11},
      'x=车长 y=离地高 z=车宽（0=中线）· 红=轮位机能包络 · 面级排序+法线着色');
}

/* ============================ glTF (.glb) 导出 ============================
   与 3D 视图同源：直接吃 build3D() 的体块，mm→m，Y 向上，X=车宽、Z=车长。 */
/* 导出用配色（比界面配色亮，便于在 Blender/查看器里看结构） */
const GLB_PAL={
  body3:'#8fa3b8', glass3:'#2e5474', tyre3:'#1b1b1e', rim3:'#8a97a3', arch3:'#b5565e',
  floor3:'#6b7d8c', batt3:'#3f8fa3', wet3:'#2f6274', seat3:'#5a6b7d', seatO3:'#8a6ea0',
  bed3:'#57a06a', isl3:'#7a6690', tbl3:'#9aa8b4', lk3:'#c8ad5e', pop3:'#4a8fd0',
  tent3:'#3f6f9f', bunk3:'#4a8fd0', scr3:'#d8c888', pj3:'#6a5a80', man3:'#d69a86',
};
function hex2lin(h){ const n=parseInt((h||'#556677').replace('#',''),16);
  const f=c=>{ c/=255; return c<=0.04045? c/12.92 : Math.pow((c+0.055)/1.055,2.4); };
  return [f(n>>16&255), f(n>>8&255), f(n&255)]; }
function glbFromScene(opts){
  const SOLID=!!(opts&&opts.solid);
  const B=build(P,M), B3=build3D(P,M,B);
  const pos=[], col=[], idx=[], idxS=[];      // idx=实心件，idxS=外壳（导出时半透明）
  const SHELL=new Set(['body3','glass3','tent3']);
  const tgt=cls=>(SOLID?idx:(SHELL.has(cls)?idxS:idx));
  const V=(x,y,z,c)=>{ pos.push(z/1000, y/1000, x/1000); col.push(c[0],c[1],c[2],1); return pos.length/3-1; };
  const C=cls=>hex2lin(GLB_PAL[cls]||(S3[cls]||S3.floor3).fill);
  const quads=(v,faces,t)=>{ for (const f of faces){ const q=f.map(i=>v[i]); t.push(q[0],q[1],q[2], q[0],q[2],q[3]); } };
  const box=(x0,x1,y0,y1,z0,z1,cls)=>{
    const c=C(cls), v=[];
    for (const z of [z0,z1]) for (const y of [y0,y1]) for (const x of [x0,x1]) v.push(V(x,y,z,c));
    quads(v,[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]],tgt(cls));
  };
  const prism=(pts,z0,z1,cls,cut)=>{
    const c=C(cls), t=tgt(cls);
    const a=pts.map(q=>V(q[0],q[1],z0,c)), b=pts.map(q=>V(q[0],q[1],z1,c));
    for (let i=1;i<pts.length-1;i++) t.push(a[0],a[i],a[i+1]);           // 远侧面
    for (let i=1;i<pts.length-1;i++) t.push(b[0],b[i],b[i+1]);           // 近侧面（外壳半透明，两片都要）
    for (let i=0;i<pts.length;i++){ const j=(i+1)%pts.length;
      t.push(a[i],a[j],b[j], a[i],b[j],b[i]); }
  };
  const cyl=(cx,cy,r,z0,z1,cls)=>{
    const c=C(cls), t=tgt(cls), N=20, ra=[], rb=[];
    for (let i=0;i<N;i++){ const t=i/N*Math.PI*2, x=cx+Math.cos(t)*r, y=cy+Math.sin(t)*r;
      ra.push(V(x,y,z0,c)); rb.push(V(x,y,z1,c)); }
    const ca=V(cx,cy,z0,c), cb=V(cx,cy,z1,c);
    for (let i=0;i<N;i++){ const j=(i+1)%N;
      t.push(ra[i],ra[j],rb[j], ra[i],rb[j],rb[i]);
      t.push(ca,ra[j],ra[i]); t.push(cb,rb[i],rb[j]); }
  };
  for (const b of B3){
    if (b.cls==='arch3') continue;        // 轮位机能包络是"分析标注"，不进模型（否则把轮子整个盖住）
    if (b.k==='box') box(b.x0,b.x1,b.y0,b.y1,b.z0,b.z1,b.cls);
    else if (b.k==='prism') prism(b.pts,b.z0,b.z1,b.cls,false);
    else if (b.k==='cyl') cyl(b.cx,b.cy,b.r,b.z0,b.z1,b.cls);

  const nV=pos.length/3, hasShell=idxS.length>0;

  if (hasShell) bin.set(new Uint8Array(idxBufS.buffer),off3);
  let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
  for (let i=0;i<pos.length;i+=3) for (let a=0;a<3;a++){ const v=pos[i+a]; if(v<mn[a])mn[a]=v; if(v>mx[a])mx[a]=v; }
  const prim=[{attributes:{POSITION:0,COLOR_0:1},indices:2,material:0}];
  if (hasShell) prim.push({attributes:{POSITION:0,COLOR_0:1},indices:3,material:1});
  const bvs=[{buffer:0,byteOffset:0,byteLength:posBuf.byteLength,target:34962},
             {buffer:0,byteOffset:off1,byteLength:colBuf.byteLength,target:34962},
             {buffer:0,byteOffset:off2,byteLength:idxBuf.byteLength,target:34963}];

             {bufferView:1,componentType:5126,count:nV,type:'VEC4'},
             {bufferView:2,componentType:5125,count:idx.length,type:'SCALAR'}];
  if (hasShell){ bvs.push({buffer:0,byteOffset:off3,byteLength:idxBufS.byteLength,target:34963});
                 acc.push({bufferView:3,componentType:5125,count:idxS.length,type:'SCALAR'}); }
  const mats=[{name:'parts',doubleSided:true,pbrMetallicRoughness:{baseColorFactor:[1,1,1,1],metallicFactor:0.15,roughnessFactor:0.8}}];
  if (hasShell) mats.push({name:'shell',doubleSided:true,alphaMode:'BLEND',
      pbrMetallicRoughness:{baseColorFactor:[1,1,1,0.18],metallicFactor:0.05,roughnessFactor:0.35}});
  const json={ asset:{version:'2.0',generator:'mycar 蓝图 v12 · 剖面引擎'},
    scene:0, scenes:[{nodes:[0]}], nodes:[{mesh:0,name:'mycar'}],
    meshes:[{name:'mycar',primitives:prim}], materials:mats,
    buffers:[{byteLength:bin.byteLength}], bufferViews:bvs, accessors:acc };
  const pad4=(n)=>(4-(n%4))%4;
  const js=JSON.stringify(json), jsPad=js+' '.repeat(pad4(js.length));
  const jsBuf=new TextEncoder().encode(jsPad);
  const binPad=new Uint8Array(bin.byteLength+pad4(bin.byteLength)); binPad.set(bin);
  const total=12+8+jsBuf.byteLength+8+binPad.byteLength;

  return {bytes:out, json, tri:(idx.length+idxS.length)/3, vert:nV};
}
function downloadGLB(){

  }
  c.appendChild(mk('sec','3D 视图（拖 SVG 旋转 / 滚轮缩放）'));
  const m3=mk('modes');
  const vbtn=(t,fn)=>{const b=mk('mbtn',t); b.onclick=()=>{fn(); if(M.view==='3d') draw3(); syncUI();}; m3.appendChild(b);};
  vbtn('侧视', ()=>{CAM.az=270;CAM.el=0;});
  vbtn('俯视', ()=>{CAM.az=270;CAM.el=78;});
  vbtn('3/4', ()=>{CAM.az=300;CAM.el=14;});
  vbtn('正视', ()=>{CAM.az=180;CAM.el=0;});
  vbtn('外壳 +', ()=>{CAM.shell=Math.min(.45,+(CAM.shell+.06).toFixed(2));});
  vbtn('外壳 −', ()=>{CAM.shell=Math.max(0,+(CAM.shell-.06).toFixed(2));});
  vbtn('包络开/关', ()=>{M3.showSlice=!M3.showSlice; redraw();});
  vbtn('复位', ()=>{CAM.az=300;CAM.el=14;CAM.zoom=1;CAM.shell=0.14;});
  c.appendChild(m3);
  const chk=mk('div'); chk.id='check'; c.appendChild(chk);
  const tw=mk('div'); tw.id='tblwrap'; c.appendChild(tw);
  c.appendChild(mk('sec','参数'));
  c.appendChild(row([
    ['撤销', ()=>{const s=undoStack.pop(); if(!s)return; const o=JSON.parse(s); Object.assign(P,o.P); Object.assign(M,o.M);}],
    ['复制参数', ()=>{navigator.clipboard?.writeText(exportJSON());}],
    ['载入参数', ()=>{const s=prompt('粘贴参数 JSON'); if(s) importJSON(s);}],
    ['复位', ()=>{for(const k in DEF) P[k]=DEF[k].v; M.fbwd=false;M.pop='closed';M.showDim=true;M.view='2d';}],
    ['导出 .glb', ()=>{try{downloadGLB();}catch(e){alert('导出失败: '+e.message);}}],
  ]));
}
let undoStack=[];
const pushUndo=()=>{undoStack.push(JSON.stringify({P,M})); if(undoStack.length>60) undoStack.shift();};
const exportJSON=()=>JSON.stringify({P,M});
function importJSON(s){try{const o=JSON.parse(s); Object.assign(P,o.P||{}); Object.assign(M,o.M||{}); redraw(); syncUI(); bandsSoon();}catch(e){alert('JSON 解析失败');}}
function syncOne(k){ const D=DEF[k];
  $('v_'+k).textContent = D.deg ? Math.round(P[k])+'°' : (D.st<1 ? (+P[k]).toFixed(2) : Math.round(P[k]));
  const n=$('n_'+k); if(n && document.activeElement!==n) n.value=P[k]; }
function syncUI(){
  for (const k in DEF){ const r=$(k); if(r) r.value=P[k]; syncOne(k); }
  document.querySelectorAll('.mbtn').forEach(b=>{ if(b._on) b.classList.toggle('on', !!b._on()); });
  redraw();
}
function redraw(){
  const B=build(P,M);
  if (M.view==='3d') render3(build3D(P,M,B));
  else renderSVG(B, project(P,M,B));
  const cs=checks(P,M,B);
  const hard=cs.filter(c=>c.lv==='hard'), bad=hard.filter(c=>!c.ok).length;
  const el=$('check'); el.replaceChildren();
  const t=document.createElement('div'); t.className='sec';
  t.textContent=`约束校验（硬 ${hard.length-bad}✓ / ${bad}✗ · 提醒 ${cs.filter(c=>c.lv==='soft'&&!c.ok).length}）`;
  el.appendChild(t);
  for (const c of cs){
    const l=document.createElement('div');
    l.className = c.lv==='info' ? 'dim' : (c.ok?'ok':(c.lv==='hard'?'warn':'flag'));
    l.textContent=(c.lv==='info'?'· ':(c.ok?'✓ ':'✗ '))+c.t+(c.ok||c.lv==='info'?'':`   → 动 ${c.fix}`);
    el.appendChild(l);
  }
  const rows=[['项','值'],['L×W×H',`${P.L}×${P.W}×${P.H}`],
    ['轴距/尾悬',`${Math.round(P.axR-P.axF)} / ${Math.round(P.L-P.axR)}`],
    ['地板/座面',`${Math.round(B.d.floor)} / ${Math.round(B.d.front.topY)}·${Math.round(B.d.rear.topY)}`],
    ['放平可睡',`${Math.round(B.d.bedRun)}`],['床中段/尾台',`${P.ud} / ${Math.round(B.d.deckLen)}`],
    ['台面离地',`${Math.round(B.d.floor+P.ihh)}`],['升顶总高',`${Math.round(B.d.popTop)}`],
    ['二排头顶',`${Math.round(B.d.humanR.headC[1]+AN.headR)}`]];
  const tw=$('tblwrap'); tw.replaceChildren();
  const tab=document.createElement('table');
  for (const [a,b] of rows){ const tr=document.createElement('tr');
    const a1=document.createElement('th'); a1.textContent=a;
    const b1=document.createElement('td'); b1.className='n'; b1.textContent=b;
    tr.append(a1,b1); tab.appendChild(tr); }
  tw.appendChild(tab);
  $('sub').textContent='世界坐标 mm：x 0=前保险杠 → 车尾 · y=离地高。本图=中心线剖面（地板/电池/座椅/人体），车轮与轮包在车外两侧，按真实位置半透明表示。';
  try{ localStorage.setItem('mycar-v12', exportJSON()); }catch(e){}
}
/* 有效区间色带：固定其余参数，扫该滑块，标出硬约束全过的区间 */
let bandTimer=null;
function bandsSoon(){ clearTimeout(bandTimer); bandTimer=setTimeout(computeBands,240); }
function computeBands(){
  const N=40;
  for (const k in DEF){
    const D=DEF[k], rng=$(k); if(!rng) continue;
    const band=rng.parentElement.querySelector('.band'); band.replaceChildren();
    let cur=null; const segs=[];
    for (let i=0;i<=N;i++){
      const q=Object.assign({},P); q[k]=D.min+(D.max-D.min)*i/N;
      let ok=false; try{ ok=hardOK(q,M); }catch(e){ ok=false; }
      if (ok){ cur?cur.b=i:cur={a:i,b:i}; } else if (cur){ segs.push(cur); cur=null; }
    }
    if (cur) segs.push(cur);
    for (const s of segs){ const el=document.createElement('div'); el.className='seg';
      el.style.left=(s.a/N*100)+'%'; el.style.width=Math.max(1,(s.b-s.a)/N*100)+'%'; band.appendChild(el); }
  }
}
buildUI();
/* 3D 交互：拖动旋转、滚轮缩放（只重绘面，不重建几何） */
(function(){
  const svg=$('sv'); let drag=null;
  svg.style.cursor='grab';
  svg.addEventListener('pointerdown',e=>{ if(M.view!=='3d')return; drag={x:e.clientX,y:e.clientY};
    svg.setPointerCapture(e.pointerId); svg.style.cursor='grabbing'; });
  svg.addEventListener('pointermove',e=>{ if(!drag)return;
    CAM.az=(CAM.az+(e.clientX-drag.x)*0.45+360)%360;
    CAM.el=Math.max(-85,Math.min(85, CAM.el-(e.clientY-drag.y)*0.35));
    drag={x:e.clientX,y:e.clientY}; draw3(); });
  const end=e=>{ if(drag){ drag=null; svg.style.cursor='grab'; } };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  svg.addEventListener('wheel',e=>{ if(M.view!=='3d')return; e.preventDefault();
    CAM.zoom=Math.max(0.3,Math.min(4, CAM.zoom*Math.exp(-e.deltaY*0.0012))); draw3(); },{passive:false});
})();
try{ const s=localStorage.getItem('mycar-v12'); if(s) importJSON(s); }catch(e){}
syncUI(); computeBands();

/* 供无头校验脚本使用（docs/design/蓝图工具.md §10） */
window.MY={P,M,DEF,AN,build,checks,project,hardOK,redraw,build3D,render3,glbFromScene,set:(o)=>{Object.assign(P,o.P||{});Object.assign(M,o.M||{});redraw();}};
</script>
</body>
</html>
