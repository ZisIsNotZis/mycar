<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>可变多形态座舱跨界车 · 参数化蓝图 v7（可调）</title>
<style>
  :root{--bg:#0d1117;--panel:#141a22;--line:#2d3742;--ink:#c9d4e0;--dim:#6b7a8c;
  --blue:#4aa3ff;--green:#5fd08a;--orange:#f0a35e;--purple:#b48ead;--cyan:#56c8d8;--yellow:#e8d174;--red:#e57373}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:16px;font-size:14px}
  h1{font-size:19px} h1 .en{color:var(--dim);font-size:11px;font-weight:400;margin-left:10px}
  .sub{color:var(--dim);font-size:12px;margin:4px 0 10px}
  .wrap{display:flex;gap:12px;align-items:flex-start}
  .left{flex:1;min-width:0}
  .right{width:330px;flex-shrink:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}
  .ctrl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;max-height:calc(100vh - 90px);overflow-y:auto}
  svg{display:block;margin:0 auto} text{font-family:inherit}
  .ctl{margin-bottom:10px}
  .ctl label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:2px}
  .ctl label b{color:var(--blue);font-family:ui-monospace,monospace}
  input[type=range]{width:100%;accent-color:#4aa3ff;height:20px}
  .warn{color:var(--red);font-size:12px;margin-top:6px;line-height:1.6}
  .ok{color:var(--green);font-size:12px;line-height:1.6;margin-top:6px}
  .sec{color:var(--dim);font-size:11px;letter-spacing:1px;margin:12px 0 6px;border-top:1px dashed var(--line);padding-top:8px}
  table{border-collapse:collapse;font-size:11.5px;width:100%}
  th,td{border:1px solid var(--line);padding:3px 7px;text-align:left}
  th{color:var(--dim);font-weight:600;background:#10161d}
  td.n{font-family:ui-monospace,monospace;color:var(--blue);text-align:right}
  .bad{color:var(--red)} .good{color:var(--green)} .flag{color:var(--orange)}
</style>
</head>
<body>
<h1>可变多形态座舱跨界车 <span class="en">PARAMETRIC BLUEPRINT v7 · drag to tune</span></h1>
<div class="sub">同轴电机与后轴共线（藏于座垫正下）· 前纵梁(前备箱·水平) + 后纵梁(车尾·水平·L隔板放平落位) · 所有坐标实时重算</div>

<div class="wrap">
<div class="left">
<div class="panel">
<svg id="sv" viewBox="0 0 1240 640" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="g" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#1a212b"/></pattern>
  <pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line y2="6" stroke="#33505c" stroke-width="1"/></pattern>
</defs>
<rect width="1240" height="640" fill="url(#g)"/>
<!-- 底图坐标：X px = 70 + x*sc ; Y px = 620 - h*sc ；sc = 980/L 自动缩放 -->
<g id="root"></g>
</svg>
<div style="font-size:11px;color:var(--dim);text-align:center">比例自动缩放以适配画幅 · 网格50px · 所有标注实时更新</div>
</div>
</div>

<div class="right">
<div class="ctrl">
  <div class="sec">总布置</div>
  <div class="ctl"><label>全长 L <b id="v_L"></b></label><input type="range" id="L" min="3400" max="4800" step="50"></div>
  <div class="ctl"><label>外宽 W <b id="v_W"></b></label><input type="range" id="W" min="1500" max="1900" step="10"></div>
  <div class="ctl"><label>车高 H <b id="v_H"></b></label><input type="range" id="H" min="1450" max="1800" step="10"></div>
  <div class="ctl"><label>前悬 <b id="v_oh"></b></label><input type="range" id="oh" min="650" max="950" step="10"></div>
  <div class="ctl"><label>前排椅背首缘 x1 <b id="v_x1"></b></label><input type="range" id="x1" min="850" max="1300" step="10"></div>

  <div class="sec">座椅与床</div>
  <div class="ctl"><label>前座垫长 <b id="v_fc"></b></label><input type="range" id="fc" min="420" max="520" step="10"></div>
  <div class="ctl"><label>二排座垫长 <b id="v_rc"></b></label><input type="range" id="rc" min="420" max="520" step="10"></div>
  <div class="ctl"><label>背长(放倒) <b id="v_rb"></b></label><input type="range" id="rb" min="500" max="620" step="10"></div>
  <div class="ctl"><label>腿托长 <b id="v_lr"></b></label><input type="range" id="lr" min="400" max="520" step="10"></div>
  <div class="ctl"><label>中岛宽 <b id="v_isl"></b></label><input type="range" id="isl" min="120" max="240" step="10"></div>
  <div class="ctl"><label>座椅净宽 <b id="v_sw"></b></label><input type="range" id="sw" min="440" max="520" step="10"></div>

  <div class="sec">底盘与三电</div>
  <div class="ctl"><label>电池厚 <b id="v_bt"></b></label><input type="range" id="bt" min="220" max="360" step="10"></div>
  <div class="ctl"><label>离地间隙 <b id="v_gc"></b></label><input type="range" id="gc" min="120" max="200" step="5"></div>
  <div class="ctl"><label>轮胎直径 <b id="v_td"></b></label><input type="range" id="td" min="600" max="720" step="2"></div>
  <div class="ctl"><label>后轴位置(0=座垫首,1=背平末端) <b id="v_ax"></b></label><input type="range" id="ax" min="0" max="1" step="0.01"></div>

  <div class="sec">尾部</div>
  <div class="ctl"><label>湿区深度 <b id="v_wd"></b></label><input type="range" id="wd" min="260" max="420" step="10"></div>
  <div class="ctl"><label>升顶抬高 <b id="v_pr"></b></label><input type="range" id="pr" min="200" max="400" step="10"></div>

  <div id="check"></div>

  <div class="sec">实时尺寸表</div>
  <table id="tbl"></table>
</div>
</div>
</div>

<script>
const P = {
  L:3900, W:1690, H:1660, oh:780, x1:1050,
  fc:450, rc:490, rb:560, lr:490, isl:200, sw:480,
  bt:300, gc:140, td:678, ax:0.55,
  wd:340, pr:300
};
const defs = {
  L:[3400,4800,50,"全长 L"], W:[1500,1900,10,"外宽 W"], H:[1450,1800,10,"车高 H"],
  oh:[650,950,10,"前悬"], x1:[850,1300,10,"前排椅背首缘 x1"],
  fc:[420,520,10,"前座垫长"], rc:[420,520,10,"二排座垫长"], rb:[500,620,10,"背长(放倒)"],
  lr:[400,520,10,"腿托长"], isl:[120,240,10,"中岛宽"], sw:[440,520,10,"座椅净宽"],
  bt:[220,360,10,"电池厚"], gc:[120,200,5,"离地间隙"], td:[600,720,2,"轮胎直径"],
  ax:[0,1,0.01,"后轴位置"], wd:[260,420,10,"湿区深度"], pr:[200,400,10,"升顶抬高"]
};
for(const k in defs){ const el=document.getElementById(k); el.min=defs[k][0]; el.max=defs[k][1]; el.step=defs[k][2]; el.value=P[k];
  el.addEventListener('input',()=>{P[k]=+el.value; render();}); }

function chain(){
  const c={};
  c.fCush0=P.x1; c.fCush1=P.x1+P.fc;            // 前排
  c.leg0=c.fCush1; c.leg1=c.leg0+P.lr;          // 腿托
  c.rCush0=c.leg1; c.rCush1=c.rCush0+P.rc;      // 二排座垫
  c.rBack1=c.rCush1+P.rb;                        // 背放平末端
  c.axle=c.rCush0+P.ax*(c.rBack1-c.rCush0);     // 后轴
  c.deck=P.L-c.rBack1;                           // 二层台/湿区长
  c.bed=P.lr+P.rc+P.rb+c.deck;                   // 床链
  c.tail=P.L-c.axle; c.tailPct=c.tail/P.L;
  c.wb=c.axle-P.oh;                              // 轴距
  c.archTop=P.gc+P.td+30;                        // 轮包顶=胎+衬+30
  c.floor=P.gc+P.bt;                             // 地板=离地+电池厚
  c.cush=c.floor+220;                            // 座垫顶
  c.hump=Math.max(0,c.archTop-c.cush);           // 波峰
  c.headroom=P.H-c.cush;
  c.poptopH=P.H+P.pr;
  c.kWh=Math.round((c.axle-0)* (P.W-410)*P.bt*160/1e9); // 电池长=轴-前防火墙后? 简化: 轴前从800起
  c.kWh=Math.round((c.axle-800)*(P.W-410)*P.bt*160/1e9);
  c.depart=Math.atan2(400-140,c.tail)*180/Math.PI;
  return c;
}
function fmt(n){return Math.round(n)}
let dr=null;
document.getElementById('sv').addEventListener('click',e=>{
  // click on svg coordinates for future drag; sliders are primary
});
function render(){
  const c=chain();
  for(const k in defs){document.getElementById('v_'+k).textContent = (k==='ax')? (+P.ax).toFixed(2) : P[k];}
  const svg=document.getElementById('root');
  const sc=980/P.L, X=x=>70+x*sc, Y=h=>620-h*sc;
  svg.setAttribute('transform','');
  let s='';
  const lw=Math.max(1.5,2.5*sc*4);
  // ---- body silhouette (proportional) ----
  const hoodH=P.gc+520, sill=P.cush+290, wsB=P.x1-120;
  s+=`<path d="M${X(0)},${Y(0)} L${X(0)},${Y(P.gc+380)} L${X(P.oh*0.3)},${Y(hoodH)} L${X(wsB)},${Y(P.gc+820)} L${X(P.x1+180)},${Y(P.H)} L${X(P.L-1150)},${Y(P.H)} L${X(P.L-620)},${Y(P.H-210)} L${X(P.L-260)},${Y(P.gc+760)} L${X(P.L)},${Y(P.gc+460)} L${X(P.L)},${Y(0)} Z" fill="#101820" stroke="#4a6076" stroke-width="2.5"/>`;
  // windows
  s+=`<path d="M${X(wsB+40)},${Y(sill+40)} L${X(P.x1+220)},${Y(P.H-40)} L${X(P.L-1200)},${Y(P.H-40)} L${X(P.L-700)},${Y(sill+150)} L${X(P.L-680)},${Y(sill+40)} Z" fill="#0a2a3a" stroke="#3a5a70" stroke-width="1.4"/>`;
  // ---- ground ----
  s+=`<line x1="40" y1="${Y(0)}" x2="1200" y2="${Y(0)}" stroke="#2d3742" stroke-width="2"/>`;
  // ---- floor ----
  s+=`<line x1="${X(P.oh-60)}" y1="${Y(c.floor)}" x2="${X(P.L-400)}" y2="${Y(c.floor)}" stroke="#7d95a8" stroke-width="2"/>`;
  s+=`<text x="${X(P.oh+350)}" y="${Y(c.floor)+14}" fill="#8fb3cc" font-size="10">地板 ${fmt(c.floor)}</text>`;
  // ---- battery ----
  s+=`<rect x="${X(800)}" y="${Y(c.floor)}" width="${(c.axle-800)*sc}" height="${P.bt*sc}" fill="#132434" stroke="#56c8d8" stroke-width="1.8" rx="3"/>`;
  s+=`<text x="${X(800+(c.axle-800)/2)}" y="${Y(c.floor-P.bt/2)+4}" fill="#56c8d8" font-size="10.5" text-anchor="middle" font-weight="700">电池 ${fmt(c.axle-800)}×${P.W-410}×${P.bt} ≈${c.kWh}kWh</text>`;
  // ---- coaxial motor on rear axle ----
  s+=`<circle cx="${X(c.axle)}" cy="${Y(P.gc+P.td/2)}" r="${170*sc}" fill="none" stroke="#e57373" stroke-width="2"/>`;
  s+=`<text x="${X(c.axle)}" y="${Y(P.gc+P.td/2)-175*sc}" fill="#e57373" font-size="9.5" text-anchor="middle">同轴电机</text>`;
  // ---- wheels ----
  const r=P.td/2*sc, wy=Y(P.gc+P.td/2);
  for(const ax of [P.oh, c.axle]){
    s+=`<circle cx="${X(ax)}" cy="${wy}" r="${r}" fill="#0a0f14" stroke="#5a7086" stroke-width="3"/>`;
    s+=`<circle cx="${X(ax)}" cy="${wy}" r="${r*0.55}" fill="none" stroke="#43586c" stroke-width="4"/>`;
    s+=`<path d="M${X(ax-r/sc-40)},${wy} a${r+40*sc},${r+40*sc} 0 0,1 ${2*(r+40*sc)},0" fill="#0d1420" stroke="#2d3742" stroke-width="2"/>`;
  }
  // ---- bed plane ----
  const by=Y(c.cush);
  s+=`<line x1="${X(c.leg0)}" y1="${by}" x2="${X(c.rBack1)}" y2="${by}" stroke="#5fd08a" stroke-width="3.5"/>`;
  // hump over rear arch if above cushion
  if(c.hump>0){
    s+=`<line x1="${X(c.axle-P.td/2-60)}" y1="${Y(c.cush+c.hump)}" x2="${X(c.axle+P.td/2+60)}" y2="${Y(c.cush+c.hump)}" stroke="#5fd08a" stroke-width="3.5"/>`;
    s+=`<line x1="${X(c.axle-P.td/2-60)}" y1="${Y(c.cush)}" x2="${X(c.axle-P.td/2-60)}" y2="${Y(c.cush+c.hump)}" stroke="#5fd08a" stroke-width="1.5"/>`;
    s+=`<line x1="${X(c.axle+P.td/2+60)}" y1="${Y(c.cush)}" x2="${X(c.axle+P.td/2+60)}" y2="${Y(c.cush+c.hump)}" stroke="#5fd08a" stroke-width="1.5"/>`;
    s+=`<text x="${X(c.axle)}" y="${Y(c.cush+c.hump)-6}" fill="#e57373" font-size="9" text-anchor="middle">+${fmt(c.hump)}波峰</text>`;
  }
  // deck continues
  s+=`<line x1="${X(c.rBack1)}" y1="${by}" x2="${X(P.L-20)}" y2="${by}" stroke="#5fd08a" stroke-width="3.5"/>`;
  // bed segment labels
  s+=`<text x="${X(c.leg0+P.lr/2)}" y="${by+16}" fill="#5fd08a" font-size="10" text-anchor="middle">腿托${P.lr}</text>`;
  s+=`<text x="${X(c.rCush0+P.rc/2)}" y="${by+16}" fill="#5fd08a" font-size="10" text-anchor="middle">座垫${P.rc}</text>`;
  s+=`<text x="${X(c.rCush1+P.rb/2)}" y="${by+16}" fill="#5fd08a" font-size="10" text-anchor="middle">背${P.rb}</text>`;
  s+=`<text x="${X(c.rBack1+c.deck/2)}" y="${by+16}" fill="#5fd08a" font-size="10" text-anchor="middle">台${fmt(c.deck)}</text>`;
  // ---- rear seat posture dashed ----
  s+=`<g stroke-dasharray="5 4" opacity=".65" fill="none" stroke="#6b7a8c" stroke-width="1.5">
    <rect x="${X(c.rCush0)}" y="${Y(c.cush)}" width="${P.rc*sc}" height="${18*sc}" />
    <path d="M${X(c.rCush1)},${Y(c.cush)+18*sc} L${X(c.rCush1)},${Y(c.cush+560)} L${X(c.rCush1+24*sc)},${Y(c.cush+557)}"/></g>`;
  // legrest extended
  s+=`<rect x="${X(c.leg0)}" y="${by}" width="${P.lr*sc}" height="${18*sc}" fill="#22303e" stroke="#8fb3cc" stroke-width="1.5"/>`;
  // backrest flat
  s+=`<path d="M${X(c.rCush1)},${by} L${X(c.rBack1)},${by-10*sc} L${X(c.rBack1)},${by+8*sc} L${X(c.rCush1)},${by+18*sc} Z" fill="#22303e" stroke="#8fb3cc" stroke-width="1.5"/>`;
  // linkage
  s+=`<path d="M${X(c.rCush0+60)},${Y(c.floor)} L${X(c.rCush1-40)},${by-8*sc} L${X(c.rCush1+60)},${by+2*sc}" fill="none" stroke="#f0a35e" stroke-width="1.8"/>`;
  // ---- front seat ----
  s+=`<rect x="${X(c.fCush0)}" y="${by}" width="${P.fc*sc}" height="${18*sc}" fill="#22303e" stroke="#8fb3cc" stroke-width="1.5"/>`;
  s+=`<path d="M${X(c.fCush1)},${by+18*sc} L${X(c.fCush1)},${Y(c.cush+560)} L${X(c.fCush1+24*sc)},${Y(c.cush+557)} Z" fill="#22303e" stroke="#8fb3cc" stroke-width="1.5"/>`;
  // pedals
  s+=`<line x1="${X(c.fCush0-10)}" y1="${by+20*sc}" x2="${X(P.oh-100)}" y2="${Y(c.floor)}" stroke="#6b7a8c" stroke-width="1.3" stroke-dasharray="4 4"/>`;
  // ---- island ----
  const i0=c.fCush0+P.fc*0.55, i1=i0+P.isl;
  s+=`<path d="M${X(i0)},${Y(c.floor)} L${X(i0)},${Y(1230)} M${X(i1)},${Y(c.floor)} L${X(i1)},${Y(1230)}" stroke="#b48ead" stroke-width="2.2"/>`;
  s+=`<rect x="${X(i0-4)}" y="${Y(1230)-12}" width="${(i1-i0)*sc+8}" height="12" fill="#1c2a36" stroke="#d8c0e0" stroke-width="1.4" rx="5"/>`;
  s+=`<text x="${X(i1+8)}" y="${Y(1230)-18}" fill="#b48ead" font-size="9.5">中岛 ${P.isl}</text>`;
  // ---- poptop ----
  s+=`<path d="M${X(c.rCush0-200)},${Y(P.H)} L${X(P.L-1200)},${Y(P.H)}" stroke="#4aa3ff" stroke-width="2.5" stroke-dasharray="9 5"/>`;
  s+=`<path d="M${X(c.rCush0-190)},${Y(P.H)} Q${X(c.rCush0-160)},${Y(P.H+P.pr*0.85)} ${X(c.rCush0-60)},${Y(P.H+P.pr)} L${X(P.L-1280)},${Y(P.H+P.pr)} Q${X(P.L-1200)},${Y(P.H+P.pr*0.85)} ${X(P.L-1190)},${Y(P.H)}" fill="none" stroke="#4aa3ff" stroke-width="1.6" stroke-dasharray="4 4" opacity=".6"/>`;
  s+=`<text x="${X((c.rCush0+P.L)/2)}" y="${Y(P.H+P.pr)-8}" fill="#4aa3ff" font-size="10.5" text-anchor="middle">升顶+${P.pr}（开口1800×1240）</text>`;
  // ---- rear beam & L-partition ----
  const rx=c.rBack1+120;
  s+=`<rect x="${X(rx)}" y="${by+3}" width="${Math.max(60,Math.min(500,P.L-P.L*0.86))*sc}" height="7" fill="#2b3a48" stroke="#7d95a8" stroke-width="1.5"/>`;
  s+=`<text x="${X(rx+120)}" y="${by-8}" fill="#8fb3cc" font-size="9">后纵梁</text>`;
  // partition upright
  s+=`<line x1="${X(c.rBack1)}" y1="${by}" x2="${X(c.rBack1)}" y2="${Y(c.floor-P.wd+40)}" stroke="#e8d174" stroke-width="3.5"/>`;
  s+=`<line x1="${X(c.rBack1)}" y1="${by}" x2="${X(c.rBack1+90)}" y2="${Y(c.floor-P.wd+40)}" stroke="#e8d174" stroke-width="1.6" stroke-dasharray="4 4" opacity=".6"/>`;
  s+=`<text x="${X(c.rBack1+8)}" y="${Y(c.floor-P.wd+80)}" fill="#e8d174" font-size="9">L隔板</text>`;
  // wet floor
  s+=`<rect x="${X(c.rBack1)}" y="${by}" width="${c.deck*sc}" height="${Y(c.floor-P.wd)-by}" fill="url(#h2)" opacity=".5"/>`;
  s+=`<text x="${X(c.rBack1+c.deck/2)}" y="${Y(c.floor-P.wd+30)}" fill="#56c8d8" font-size="9.5" text-anchor="middle">湿区 深${P.wd}×${fmt(c.deck)}</text>`;
  // ---- beams ----
  s+=`<rect x="${X(P.oh*0.35)}" y="${Y(P.gc+P.td-140)}" width="${Math.max(50,P.oh*0.35*sc)}" height="8" fill="#2b3a48" stroke="#7d95a8" stroke-width="1.5"/>`;
  s+=`<text x="${X(P.oh*0.5)}" y="${Y(P.gc+P.td-140)-8}" fill="#8fb3cc" font-size="9">前纵梁</text>`;
  // ---- axle under cushion marker ----
  s+=`<line x1="${X(c.axle)}" y1="${by}" x2="${X(c.axle)}" y2="${Y(0)}" stroke="#e57373" stroke-width="1" stroke-dasharray="5 4" opacity=".7"/>`;
  s+=`<text x="${X(c.axle)}" y="${Y(0)-8}" fill="#e57373" font-size="9.5" text-anchor="middle">后轴 ∈ 座垫${P.ax>0.02?'✓':'✗'}</text>`;
  // ---- vertical chain ----
  const hts=[[0,'0'],[c.floor,'地板'+fmt(c.floor)],[c.cush,'床面'+fmt(c.cush)],[c.cush+560,'背顶'+fmt(c.cush+560)],[P.H,'顶'+P.H],[P.H+P.pr,'升'+(P.H+P.pr)]];
  for(const [h,t] of hts){ s+=`<line x1="44" y1="${Y(h)}" x2="56" y2="${Y(h)}" stroke="#7d95a8"/>`;
    s+=`<text x="58" y="${Y(h)+3}" fill="#8fb3cc" font-size="8.5">${t}</text>`; }
  s+=`<line x1="50" y1="${Y(0)}" x2="50" y2="${Y(P.H+P.pr)}" stroke="#7d95a8" stroke-width="1"/>`;
  // ---- longitudinal chain ----
  s+=`<line x1="${X(0)}" y1="${Y(0)+18}" x2="${X(P.oh)}" y2="${Y(0)+18}" stroke="#7d95a8"/>`;
  s+=`<line x1="${X(P.oh)}" y1="${Y(0)+18}" x2="${X(c.axle)}" y2="${Y(0)+18}" stroke="#7d95a8"/>`;
  s+=`<line x1="${X(c.axle)}" y1="${Y(0)+18}" x2="${X(P.L)}" y2="${Y(0)+18}" stroke="#7d95a8"/>`;
  s+=`<text x="${X(P.oh/2)}" y="${Y(0)+32}" fill="#8fb3cc" font-size="9.5" text-anchor="middle">前悬${P.oh}</text>`;
  s+=`<text x="${X((P.oh+c.axle)/2)}" y="${Y(0)+32}" fill="#8fb3cc" font-size="9.5" text-anchor="middle">轴距${fmt(c.wb)}</text>`;
  s+=`<text x="${X((c.axle+P.L)/2)}" y="${Y(0)+32}" fill="#8fb3cc" font-size="9.5" text-anchor="middle">尾悬${fmt(c.tail)} (${Math.round(c.tailPct*100)}%)</text>`;
  svg.innerHTML=s;

  // ---- checks ----
  let msgs=[];
  msgs.push(c.bed>=1750?`<span class="good">✓ 床链 ${fmt(c.bed)} ≥1750</span>`:`<span class="bad">✗ 床链 ${fmt(c.bed)} &lt;1750</span>`);
  msgs.push(c.tailPct<0.45?`<span class="good">✓ 尾悬占比 ${Math.round(c.tailPct*100)}%</span>`:`<span class="bad">✗ 尾悬占比 ${Math.round(c.tailPct*100)}% 过长</span>`);
  msgs.push(c.headroom>=950?`<span class="good">✓ 净高 ${fmt(c.headroom)}</span>`:`<span class="bad">✗ 净高 ${fmt(c.headroom)} &lt;950</span>`);
  msgs.push(c.kWh>=60?`<span class="good">✓ 电池 ≈${c.kWh}kWh</span>`:`<span class="bad">✗ 电池 ${c.kWh}kWh &lt;60</span>`);
  msgs.push(c.hump<=60?`<span class="good">✓ 轮包波峰 +${fmt(c.hump)}</span>`:`<span class="bad">✗ 波峰 +${fmt(c.hump)} 过大（床垫难摊平）</span>`);
  msgs.push(c.depart>=10?`<span class="good">✓ 离去角 ${c.depart.toFixed(1)}°</span>`:`<span class="flag">△ 离去角 ${c.depart.toFixed(1)}°（按杠下缘400）</span>`);
  const iso=(P.W-410-2*P.sw-P.isl)/2;
  msgs.push(iso>=100?`<span class="good">✓ 座椅-中岛间隙 ${fmt(iso)}</span>`:`<span class="bad">✗ 间隙 ${fmt(iso)} &lt;100</span>`);
  document.getElementById('check').innerHTML='<div class="sec">约束校验</div>'+msgs.join('<br>');

  // ---- table ----
  document.getElementById('tbl').innerHTML=`
  <tr><th>项</th><th>值</th></tr>
  <tr><td>全长×宽×高</td><td class="n">${P.L}×${P.W}×${P.H}</td></tr>
  <tr><td>轴距</td><td class="n">${fmt(c.wb)}</td></tr>
  <tr><td>尾悬/占比</td><td class="n">${fmt(c.tail)} / ${Math.round(c.tailPct*100)}%</td></tr>
  <tr><td>床链</td><td class="n">${fmt(c.bed)}</td></tr>
  <tr><td>地板/床面</td><td class="n">${fmt(c.floor)} / ${fmt(c.cush)}</td></tr>
  <tr><td>净高</td><td class="n">${fmt(c.headroom)}</td></tr>
  <tr><td>电池</td><td class="n">≈${c.kWh}kWh</td></tr>
  <tr><td>离去角</td><td class="n">${c.depart.toFixed(1)}°</td></tr>
  <tr><td>升顶总高</td><td class="n">${P.H+P.pr}</td></tr>`;
}
render();
</script>
</body>
</html>
